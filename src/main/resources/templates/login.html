<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Estatal de Ingresos</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"
            integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/login-style.css}"> </head>
<body>
<div class="main-container">
    <div class="login-wrapper">
        <div class="form-column">
            <h2>Iniciar Sesión</h2>

            <div id="login-response" class="response-area">
                <div th:if="${param.logout}" class="logout-message">
                    Has cerrado sesión correctamente.
                </div>
            </div>

            <form
                    id="login-form"
                    method="post"
                    th:attr="hx-post=@{/login}"
                    hx-target="#login-response"
                    hx-swap="innerHTML"
                    hx-indicator="#loading-indicator" >

                <div class="form-group">
                    <label for="username">Usuario<span class="required">*</span></label>
                    <input type="text" id="username" name="username" required autofocus placeholder="usuario.ejemplo" />
                </div>

                <div class="form-group password-group">
                    <label for="password">Contraseña<span class="required">*</span></label>
                    <input type="password" id="password" name="password" required placeholder="••••••••••" />
                    <span class="password-toggle-icon" onclick="togglePasswordVisibility()">👁️</span>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-options">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit">Iniciar Sesión</button>
                <div id="loading-indicator" class="htmx-indicator loading-indicator"> Procesando...</div>
            </form>
        </div>

        <div class="logo-column">
            <img th:src="@{/images/logo-durango.png}" alt="Logo Gobierno del Estado de Durango"> <h1>Sistema Estatal de Ingresos</h1>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const icon = document.querySelector('.password-toggle-icon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            icon.textContent = '👁️';
        }
    }
</script>
</body>
</html>
